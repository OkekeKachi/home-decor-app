services:
  api:
    build: .
    container_name: luxhome-api
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:6
    container_name: luxhome-mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: